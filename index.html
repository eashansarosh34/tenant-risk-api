<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractional - AI-Powered Rent Advance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #667eea; text-align: center; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; font-size: 1.1em; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        input:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .btn:hover { transform: translateY(-2px); }
        .results { margin-top: 30px; padding: 25px; background: #f8f9fa; border-radius: 12px; display: none; }
        .results.show { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .result-item { margin-bottom: 15px; padding: 20px; background: white; border-radius: 8px; border-left: 4px solid #667eea; }
        .result-label { font-size: 14px; color: #666; margin-bottom: 5px; }
        .result-value { font-size: 28px; font-weight: 700; color: #333; }
        .risk-low { border-left-color: #4caf50; }
        .risk-medium { border-left-color: #ff9800; }
        .risk-high { border-left-color: #f44336; }
        .info { text-align: center; margin-top: 30px; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Fractional</h1>
        <p class="subtitle">AI-Powered Landlord Return Calculator</p>
        
        <form id="calculatorForm">
            <div class="form-group">
                <label>Monthly Rent Amount ($)</label>
                <input type="number" id="rent" required min="100" step="10" placeholder="e.g., 1500">
            </div>
            <div class="form-group">
                <label>Tenant's Monthly Income ($)</label>
                <input type="number" id="income" required min="0" step="100" placeholder="e.g., 5000">
            </div>
            <div class="form-group">
                <label>Tenant's Credit Score (300-850)</label>
                <input type="number" id="credit" required min="300" max="850" placeholder="e.g., 720">
            </div>
            <div class="form-group">
                <label>Years of Employment</label>
                <input type="number" id="employment" required min="0" step="0.5" placeholder="e.g., 3">
            </div>
            <div class="form-group">
                <label>Previous Evictions</label>
                <input type="number" id="evictions" required min="0" value="0">
            </div>
            <div class="form-group">
                <label>Late Payments (Last 12 Months)</label>
                <input type="number" id="latePayments" required min="0" value="0">
            </div>
            <button type="submit" class="btn">Calculate Your Returns 💰</button>
        </form>
        
        <div class="results" id="results">
            <div class="result-item" id="riskItem">
                <div class="result-label">Risk Level</div>
                <div class="result-value" id="riskLevel"></div>
            </div>
            <div class="result-item">
                <div class="result-label">Day 1 Advance to Landlord</div>
                <div class="result-value" id="advanceAmount" style="color:#667eea;"></div>
            </div>
            <div class="result-item">
                <div class="result-label">Advance Percentage</div>
                <div class="result-value" id="advancePercent"></div>
            </div>
            <div class="result-item">
                <div class="result-label">Default Probability</div>
                <div class="result-value" id="defaultProb"></div>
            </div>
        </div>
        
        <p class="info">✨ Powered by AI Risk Assessment Model</p>
    </div>
    
    <script>
        document.getElementById('calculatorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const rent = parseFloat(document.getElementById('rent').value);
            const income = parseFloat(document.getElementById('income').value);
            const credit = parseInt(document.getElementById('credit').value);
            const employment = parseFloat(document.getElementById('employment').value);
            const evictions = parseInt(document.getElementById('evictions').value);
            const latePayments = parseInt(document.getElementById('latePayments').value);
            
            const rentToIncome = rent / income;
            const employmentMonths = employment * 12;
            const totalDelays = evictions + latePayments;
            
            let riskScore = 0.5;
            riskScore -= (credit - 650) * 0.0005;
            riskScore += rentToIncome * 0.8;
            riskScore -= employmentMonths * 0.002;
            riskScore += totalDelays * 0.15;
            riskScore += evictions * 0.25;
            
            riskScore = Math.max(0.02, Math.min(0.95, riskScore));
            
            let riskCategory, advancePct, borderColor;
            if (riskScore < 0.15) {
                riskCategory = 'Low Risk';
                advancePct = 75;
                borderColor = 'risk-low';
            } else if (riskScore < 0.35) {
                riskCategory = 'Medium Risk';
                advancePct = 55;
                borderColor = 'risk-medium';
            } else {
                riskCategory = 'High Risk';
                advancePct = 30;
                borderColor = 'risk-high';
            }
            
            const advanceAmount = rent * (advancePct / 100);
            
            document.getElementById('riskLevel').textContent = riskCategory;
            document.getElementById('advanceAmount').textContent = '$' + advanceAmount.toFixed(2);
            document.getElementById('advancePercent').textContent = advancePct + '%';
            document.getElementById('defaultProb').textContent = (riskScore * 100).toFixed(1) + '%';
            
            document.getElementById('riskItem').className = 'result-item ' + borderColor;
            document.getElementById('results').classList.add('show');
        });
    </script>
</body>
</html>
